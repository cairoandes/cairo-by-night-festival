name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack site
        run: |
          mkdir -p _site
          unzip -q cairo-by-night-site-20261031.zip -d _site
      - name: Prepare project path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("_site")
          prefix = "/cairo-by-night-festival/"
          for path in root.rglob("*"):
              if path.suffix not in {".html", ".js", ".css"}:
                  continue
              text = path.read_text()
              text = text.replace('href="/', f'href="{prefix}')
              text = text.replace('src="/', f'src="{prefix}')
              text = text.replace("url('/assets/", f"url('{prefix}assets/")
              path.write_text(text)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
